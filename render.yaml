services:
  - type: web
    name: prism-evidence-engine
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_TIER
        value: free
      - key: MAX_CONCURRENT_CALLS
        value: "2"
      - key: GEMINI_API_KEY
        sync: false
